name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} / real Inkscape
    runs-on: ubuntu-latest
    # The locked PyGObject requires girepository-2.0; Ubuntu 24.04's native
    # libraries are too old. Keep the OS explicit instead of patching pkg-config.
    container: ubuntu:26.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      UV_PYTHON: ${{ matrix.python-version }}
      INKSCAPE_PATH: /usr/bin/inkscape
      INKSCAPE_MCP_METRICS_ENABLED: "false"
      MCP_TRANSPORT: stdio

    steps:
      - name: Install native build and desktop dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends -y \
            ca-certificates curl git build-essential pkg-config python3-dev \
            libcairo2-dev libgirepository-2.0-dev gir1.2-gtk-3.0 \
            inkscape libmagic1 fonts-dejavu-core xvfb xauth dbus-x11 xclip \
            python3-numpy python3-lxml python3-scour python3-cssselect python3-platformdirs

      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.16"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python dependencies
        run: uv sync --frozen --group dev

      - name: Verify native runtime
        run: |
          uv run --frozen python --version
          inkscape --version
          uv run --frozen python -c "import gi, cairo, inkex; print('Native Python dependencies import successfully')"
          /usr/bin/python3 -c "import sys; sys.path.insert(0, '/usr/share/inkscape/extensions'); import inkex; print('Inkscape extension interpreter imports successfully')"

      - name: Lint Python
        run: uv run --frozen ruff check src tests scripts/desktop_smoke.py run_server.py

      - name: Check Python formatting
        run: uv run --frozen ruff format --check src tests scripts/desktop_smoke.py run_server.py

      - name: Run unit and real CLI integration tests
        run: uv run --frozen pytest tests --junitxml=test-results.xml

      - name: Run offline fleet workflow
        run: uv run --frozen python scripts/fleet_e2e_smoke.py --offline --strict --offline-work-dir /tmp/inkscape-fleet-smoke

      - name: Exercise two real GUI documents over stdio MCP
        if: matrix.python-version == '3.12'
        env:
          GDK_BACKEND: x11
          XDG_CONFIG_HOME: /tmp/inkscape-ci-config
          XDG_CACHE_HOME: /tmp/inkscape-ci-cache
          # Glycin's nested image-loader sandbox cannot start in this CI
          # container. Scope its upstream test option to this isolated GUI run.
          GLYCIN_DISABLE_SANDBOX: i-know-the-risks
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- \
            uv run --frozen python scripts/desktop_smoke.py --output-dir /tmp/inkscape-desktop-smoke

      - name: Build and validate Python distributions
        run: |
          uv build --no-build-isolation
          uv run --frozen twine check dist/*

      - name: Verify wheel imports outside the source checkout
        run: |
          uv pip install --python .venv/bin/python --no-deps --reinstall dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/.venv/bin/python" -c \
            "from pathlib import Path; import inkscape_mcp, inkscape_mcp.main; p = Path(inkscape_mcp.__file__); assert 'site-packages' in p.parts, p; print(p)"

      - name: Upload Python validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.python-version }}-reports
          path: |
            test-results.xml
            coverage.xml
            htmlcov/
            /tmp/inkscape-desktop-smoke/
            /tmp/inkscape-ci-cache/inkscape-mcp/
          if-no-files-found: warn

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.python-version }}-distributions
          path: dist/
          if-no-files-found: error

  frontend:
    name: Frontend lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web_sota
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install locked frontend dependencies
        run: bun install --frozen-lockfile
      - name: Lint frontend
        run: bun run lint
      - name: Build frontend
        run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: web_sota/dist/
          if-no-files-found: error
