<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="480"
   height="120"
   viewBox="0 0 480 120"
   version="1.1"
   id="svg_ui_icons"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns="http://www.w3.org/2000/svg">
  <!-- Clean SVG Icon Set for UI & Path Operation Testing -->
  <g inkscape:groupmode="layer" id="layer_icons" inkscape:label="UI Icons">
    <!-- Icon 1: Settings Gear -->
    <g id="icon_settings" transform="translate(20, 20)">
      <rect width="80" height="80" rx="12" fill="#0F172A" id="bg_icon1" />
      <path id="path_gear" d="M 60,40 A 20,20 0 1,0 60,40.01 Z M 60,15 L 65,23 A 26,26 0 0,1 73,26 L 82,23 L 87,32 L 80,38 A 26,26 0 0,1 81,47 L 90,50 L 90,60 L 81,63 A 26,26 0 0,1 80,72 L 87,78 L 82,87 L 73,84 A 26,26 0 0,1 65,87 L 60,95 L 50,95 L 45,87 A 26,26 0 0,1 37,84 L 28,87 L 23,78 L 30,72 A 26,26 0 0,1 29,63 L 20,60 L 20,50 L 29,47 A 26,26 0 0,1 30,38 L 23,32 L 28,23 L 37,26 A 26,26 0 0,1 45,23 L 50,15 Z" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="scale(0.8) translate(12, 12)" />
    </g>

    <!-- Icon 2: Vector Pen / Layer -->
    <g id="icon_vector_pen" transform="translate(140, 20)">
      <rect width="80" height="80" rx="12" fill="#0F172A" id="bg_icon2" />
      <path id="path_pen" d="M 30,60 L 25,65 L 20,60 L 25,30 L 50,20 L 60,30 L 30,60 Z M 50,20 L 60,30" fill="none" stroke="#818CF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="25" cy="65" r="4" fill="#818CF8" id="pen_tip" />
    </g>

    <!-- Icon 3: Image Trace -->
    <g id="icon_trace" transform="translate(260, 20)">
      <rect width="80" height="80" rx="12" fill="#0F172A" id="bg_icon3" />
      <path id="path_landscape" d="M 20,60 L 35,35 L 50,50 L 60,40 L 70,60 Z" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="30" cy="30" r="5" fill="#34D399" id="sun_circle" />
    </g>

    <!-- Icon 4: Code / QR -->
    <g id="icon_qr_code" transform="translate(380, 20)">
      <rect width="80" height="80" rx="12" fill="#0F172A" id="bg_icon4" />
      <rect x="25" y="25" width="12" height="12" fill="#F43F5E" id="qr_corner_tl" />
      <rect x="53" y="25" width="12" height="12" fill="#F43F5E" id="qr_corner_tr" />
      <rect x="25" y="53" width="12" height="12" fill="#F43F5E" id="qr_corner_bl" />
      <path d="M 45,25 H 48 V 37 H 45 Z M 25,45 H 37 V 48 H 25 Z M 45,45 H 65 V 65 H 45 Z" fill="#F43F5E" id="qr_data_bits" />
    </g>
  </g>
</svg>
