<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="400"
   height="400"
   viewBox="0 0 400 400"
   version="1.1"
   id="svg_logo_badge"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg">
  <defs id="defs_badge">
    <linearGradient id="grad_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E293B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad_accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38BDF8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818CF8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <path id="text_path_circle" d="M 60,200 A 140,140 0 1,1 340,200" />
  </defs>
  <sodipodi:namedview
     id="namedview_badge"
     pagecolor="#ffffff"
     bordercolor="#666666"
     borderopacity="1.0"
     inkscape:pageopacity="0.0"
     inkscape:pageshadow="2"
     inkscape:zoom="1.0"
     inkscape:cx="200"
     inkscape:cy="200"
     inkscape:document-units="px"
     inkscape:current-layer="layer_badge_bg" />
  <g inkscape:groupmode="layer" id="layer_badge_bg" inkscape:label="Background">
    <circle cx="200" cy="200" r="180" fill="url(#grad_bg)" filter="url(#shadow)" id="bg_circle" />
    <circle cx="200" cy="200" r="160" fill="none" stroke="url(#grad_accent)" stroke-width="4" stroke-dasharray="8,4" id="outer_ring" />
  </g>
  <g inkscape:groupmode="layer" id="layer_badge_emblem" inkscape:label="Emblem">
    <path id="shield_shape" d="M 200,80 L 270,110 V 190 C 270,245 200,285 200,285 C 200,285 130,245 130,190 V 110 Z" fill="url(#grad_accent)" opacity="0.9" />
    <polygon id="star_center" points="200,125 212,150 240,152 218,170 225,198 200,182 175,198 182,170 160,152 188,150" fill="#FFFFFF" />
  </g>
  <g inkscape:groupmode="layer" id="layer_badge_text" inkscape:label="Text &amp; Banner">
    <text font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#38BDF8" id="text_top">
      <textPath href="#text_path_circle" startOffset="50%" text-anchor="middle">INKSCAPE MCP VECTOR</textPath>
    </text>
    <rect id="banner_rect" x="80" y="310" width="240" height="40" rx="8" fill="#1E293B" stroke="url(#grad_accent)" stroke-width="2" />
    <text id="banner_text" x="200" y="336" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#F8FAFC" text-anchor="middle">SOTA CERTIFIED</text>
  </g>
</svg>
