<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="600"
   height="400"
   viewBox="0 0 600 400"
   version="1.1"
   id="svg_tech_diagram"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns="http://www.w3.org/2000/svg">
  <defs id="defs_diagram">
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0,0 L 10,5 L 0,10 z" fill="#64748B" />
    </marker>
  </defs>
  <g inkscape:groupmode="layer" id="layer_grid" inkscape:label="Grid &amp; Background">
    <rect width="600" height="400" fill="#090D16" id="rect_bg" />
    <path d="M 0,100 H 600 M 0,200 H 600 M 0,300 H 600 M 150,0 V 400 M 300,0 V 400 M 450,0 V 400" stroke="#1E293B" stroke-width="1" stroke-dasharray="4,4" id="grid_lines" />
  </g>
  <g inkscape:groupmode="layer" id="layer_connectors" inkscape:label="Connectors">
    <path id="conn_client_mcp" d="M 120,200 H 220" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)" />
    <path id="conn_mcp_inkscape" d="M 340,200 H 440" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)" />
    <path id="conn_mcp_output" d="M 280,240 V 310" stroke="#64748B" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)" />
  </g>
  <g inkscape:groupmode="layer" id="layer_nodes" inkscape:label="Nodes">
    <!-- Client Node -->
    <g id="node_client" transform="translate(20, 160)">
      <rect width="100" height="80" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="2" id="box_client" />
      <text x="50" y="45" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#38BDF8" text-anchor="middle">LLM Agent</text>
    </g>
    <!-- MCP Server Node -->
    <g id="node_mcp" transform="translate(220, 150)">
      <rect width="120" height="100" rx="10" fill="#1E1E2E" stroke="#818CF8" stroke-width="3" id="box_mcp" />
      <text x="60" y="45" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#818CF8" text-anchor="middle">inkscape-mcp</text>
      <text x="60" y="70" font-family="Segoe UI, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">FastMCP 3.2+</text>
    </g>
    <!-- Inkscape Engine Node -->
    <g id="node_inkscape" transform="translate(440, 160)">
      <rect width="120" height="80" rx="8" fill="#1E293B" stroke="#34D399" stroke-width="2" id="box_inkscape" />
      <text x="60" y="40" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#34D399" text-anchor="middle">Inkscape CLI</text>
      <text x="60" y="60" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">v1.3+ Batch</text>
    </g>
    <!-- Output Node -->
    <g id="node_output" transform="translate(220, 310)">
      <rect width="120" height="50" rx="6" fill="#0F172A" stroke="#F43F5E" stroke-width="2" id="box_output" />
      <text x="60" y="30" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#F43F5E" text-anchor="middle">SVG / PNG / DXF</text>
    </g>
  </g>
</svg>
